[project]
name = "tacpe"
version = "1.1.7"
description = "CLI to add work entries into the CPE TA site, one at a time or in bulk from a CSV"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.62.0",
    "python-dotenv>=1.2.2",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "tzdata>=2025.2",
]

[project.scripts]
tacpe = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
